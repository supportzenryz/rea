<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sundar Rajan</title>
    <meta name="description" content="Sundar Rajan, fashion photographer working between India and Europe." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true"><p id="intro-name" class="intro-name">Sundar Rajan</p></div>

    <!-- Smudge for the opening name: turbulence drives a displacement whose
         strength app.js raises as the name melts away. -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="smudge" x="-30%" y="-150%" width="160%" height="400%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap id="smudge-map" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <header class="masthead">
      <a href="#/" class="name">Sundar Rajan</a>
    </header>

    <main>
      <section id="stage" class="stage" aria-live="polite">
        <div class="zones"><a data-zone="prev"></a><a data-zone="next"></a></div>
      </section>
      <section id="thumbs" class="thumbs" hidden></section>
    </main>

    <p id="touch-count" class="touch-count" aria-hidden="true"></p>

    <aside id="panel" class="panel" aria-label="Index">
      <nav class="tabs">
        <button type="button" data-tab="works">Works</button>
        <button type="button" data-tab="info">Info</button>
        <button type="button" class="close" aria-label="Close index" data-cursor="Close">×</button>
      </nav>
      <ol id="works" class="works" data-pane="works"></ol>
      <div id="info" class="info" data-pane="info" hidden></div>
    </aside>

    <nav class="switch" aria-label="View">
      <a href="#/" data-view="index">Index</a>
      <span aria-hidden="true">—</span>
      <a href="#/thumbnails" data-view="thumbnails">Thumbnails</a>
    </nav>

    <div id="cursor" class="cursor" aria-hidden="true"><span class="dot"></span><span class="label"></span></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
